<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1188 180" role="img" aria-label="Six cities. Bosses are quizzes. English and Arabic. One file."><rect width="1188" height="180" fill="#14172e" rx="18"/><rect x="20" y="20" width="272" height="140" rx="14" fill="#1f2447"/><rect x="20" y="20" width="272" height="6" rx="3" fill="#ffd24a"/><text x="40" y="78" font-family="'Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="900" fill="#ffd24a">6 cities</text><text x="40" y="112" font-family="'Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#f4f1e8">Meadows to Hidden Islands,</text><text x="40" y="134" font-family="'Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#f4f1e8">one ML idea per place.</text><rect x="312" y="20" width="272" height="140" rx="14" fill="#1f2447"/><rect x="312" y="20" width="272" height="6" rx="3" fill="#5ee0c1"/><text x="332" y="78" font-family="'Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="900" fill="#5ee0c1">Boss = quiz</text><text x="332" y="112" font-family="'Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#f4f1e8">Win by answering real</text><text x="332" y="134" font-family="'Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#f4f1e8">machine learning questions.</text><rect x="604" y="20" width="272" height="140" rx="14" fill="#1f2447"/><rect x="604" y="20" width="272" height="6" rx="3" fill="#ff8fb1"/><text x="624" y="78" font-family="'Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="900" fill="#ff8fb1">EN + AR</text><text x="624" y="112" font-family="'Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#f4f1e8">Fully playable in English</text><text x="624" y="134" font-family="'Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#f4f1e8">and Arabic (right-to-left).</text><rect x="896" y="20" width="27